<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhishGuard Lite</title>
  <style>
    /* ── Reset & base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      max-height: 580px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 0 0 16px;
      user-select: none;
    }

    body::-webkit-scrollbar {
      width: 6px;
    }
    body::-webkit-scrollbar-track {
      background: #0f172a;
    }
    body::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e293b;
      padding: 12px 16px;
      border-bottom: 1px solid #334155;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-icon { font-size: 22px; }
    .header-title { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
    .header-sub   { font-size: 11px; color: #94a3b8; margin-top: 1px; }

    /* ── URL card ── */
    .url-card {
      margin: 12px 16px 0;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .url-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #64748b; margin-bottom: 4px; }
    .url-text  { font-size: 11px; color: #cbd5e1; word-break: break-all; line-height: 1.4; font-family: monospace; }

    /* ── Score ring ── */
    .score-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 14px 0 8px;
    }
    .ring-wrap { position: relative; width: 100px; height: 100px; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-bg    { fill: none; stroke: #1e293b; stroke-width: 9; }
    .ring-fill  { fill: none; stroke-width: 9; stroke-linecap: round;
                  transition: stroke-dashoffset 0.6s ease, stroke 0.4s ease; }
    .ring-text  {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .ring-score   { font-size: 26px; font-weight: 800; line-height: 1; }
    .ring-max     { font-size: 10px; color: #64748b; margin-top: 2px; }

    /* ── Verdict badge ── */
    .verdict-badge {
      margin-top: 8px;
      padding: 4px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .verdict-safe       { background: #14532d; color: #4ade80; }
    .verdict-suspicious { background: #451a03; color: #fbbf24; }
    .verdict-phishing   { background: #450a0a; color: #f87171; }
    .verdict-unknown    { background: #1e293b; color: #94a3b8; }

    /* ── Warning alert banner ── */
    .warning-alert {
      margin: 10px 16px 4px;
      background: #450a0a;
      border: 1px solid #dc2626;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 11px;
      color: #fca5a5;
      line-height: 1.4;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-weight: 600;
    }
    .warning-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }

    /* ── Signals Pill List ── */
    .signals-box {
      margin: 10px 16px 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .signal-pill {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: #7f1d1d;
      color: #fecaca;
      border: 1px solid #b91c1c;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Features grid ── */
    .features-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: #64748b; margin: 12px 16px 6px;
      font-weight: 700;
    }
    .features-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: 0 16px;
    }
    .feat-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 7px;
      padding: 7px 9px;
    }
    .feat-name  { font-size: 9.5px; color: #94a3b8; text-transform: capitalize; margin-bottom: 2px; }
    .feat-value { font-size: 11.5px; font-weight: 600; }
    .feat-danger { color: #f87171; }
    .feat-safe   { color: #4ade80; }
    .feat-warn   { color: #fbbf24; }
    .feat-num    { color: #93c5fd; }

    /* ── Footer ── */
    .footer {
      margin: 14px 16px 0;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }

    /* ── Loading / error states ── */
    .state-box {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 180px; gap: 10px;
      color: #94a3b8; font-size: 13px;
      padding: 0 20px;
      text-align: center;
    }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid #334155;
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <span class="header-icon">🛡️</span>
    <div>
      <div class="header-title">PhishGuard Lite</div>
      <div class="header-sub">16-Criteria Heuristic Security Engine</div>
    </div>
  </div>

  <!-- Dynamic content injected by popup.js -->
  <div id="app">
    <div class="state-box">
      <div class="spinner"></div>
      <span>Analysing page signals…</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
