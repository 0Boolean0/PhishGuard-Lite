<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; font-family: sans-serif; padding: 12px; margin: 0; }
    .card { border-radius: 8px; padding: 12px; text-align: center; color: white; }
    .safe { background-color: #28a745; }
    .danger { background-color: #dc3545; }
    .unknown { background-color: #6c757d; }
    h3 { margin: 0 0 8px 0; font-size: 16px; }
    p { margin: 4px 0; font-size: 13px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="status-card" class="card unknown">
    <h3 id="status-title">Checking site...</h3>
    <p id="site-url"></p>
    <p id="confidence"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
